services:
  db:
    image: mysql:8.4
    container_name: clash-config-store-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: clash_config_store
      MYSQL_USER: clash
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-clashpassword}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clash-config-store-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_TYPE=mysql
      - DB_DSN=clash:${MYSQL_PASSWORD:-clashpassword}@tcp(db:3306)/clash_config_store?charset=utf8mb4&parseTime=True&loc=Local
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret}
      - JWT_EXPIRY_HOURS=24
      - GEOIP_PATH=/data/GeoLite2-City.mmdb
      - BASE_URL=${BASE_URL:-http://localhost:8080}
    volumes:
      - backend_data:/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clash-config-store-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  mysql_data:
  backend_data:

networks:
  app_network:
    driver: bridge
